name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: CLI smoke test
        run: |
          echo '{}' | node bin/ttt.mjs bar
          node bin/ttt.mjs help
      - name: Shell syntax
        run: bash -n install.sh .claude/bin/cc-health.sh .claude/bin/cc-tokens .claude/bin/sam
